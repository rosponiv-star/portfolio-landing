<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valerio Rosponi - Portfolio</title>
    <!-- Importing Geist Font from Google Fonts (Regular 400, Medium 500) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500&display=swap" rel="stylesheet">
    <style>
        /* Reset and Base Styles */
        body {
            margin: 0;
            padding: 0;
            background-color: #f5f5f0;
            color: #1a1a1a;
            font-family: 'Geist', sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            height: 100dvh; /* Modern fix for mobile address bars */
            overflow: hidden; /* strictly prevents any scrolling */
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* Animations */
        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .animate-fade-up {
            opacity: 0; /* Start hidden before animation */
            animation: fadeUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        /* Staggered animation delays for a smooth flowing effect */
        .delay-1 { animation-delay: 0.15s; }
        .delay-2 { animation-delay: 0.3s; }
        .delay-3 { animation-delay: 0.45s; }

        /* Main Content Container */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 1.5rem;
            z-index: 10;
        }

        /* Typography */
        h1 {
            font-size: 48px;
            font-weight: 500; /* Medium weight */
            margin: 0 0 0.5rem 0;
            letter-spacing: -0.02em;
        }

        p.subtitle {
            font-size: 1.125rem; /* Scaled down slightly to balance with 48px title */
            color: #555;
            margin: 0;
            font-weight: 400;
        }

        /* Footer Styles */
        footer {
            padding: 1.5rem 1rem 2rem 1rem;
            text-align: center;
            z-index: 10;
        }

        footer p {
            font-size: 0.9rem;
            color: #666;
            margin: 0 0 0.5rem 0;
        }

        footer a {
            color: #2b9e4d; /* Slightly darker green for better contrast */
            text-decoration: underline;
            text-underline-offset: 4px;
            font-weight: 400;
            font-size: 0.95rem;
            transition: opacity 0.2s ease;
        }

        footer a:hover {
            opacity: 0.7; /* Gentle fade on hover */
        }

        /* Responsive adjustments for mobile */
        @media (max-width: 600px) {
            h1 {
                font-size: 36px;
            }
            p.subtitle {
                font-size: 1rem;
            }
            main {
                padding: 1rem;
            }
            footer {
                padding: 1rem 1rem 1.5rem 1rem;
            }
        }

        /* Canvas Styles */
        #gameCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100dvh;
            z-index: 0; /* Behind the text */
            pointer-events: none; /* Allows clicking links and selecting text through the canvas */
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    
    <main>
        <h1 class="animate-fade-up">Valerio Rosponi</h1>
        <p class="subtitle animate-fade-up delay-1">Portfolio is currently under construction and will be available soon.</p>
    </main>
    <footer>
        <p class="animate-fade-up delay-2">See my work here in the meantime:</p>
        <a href="https://valeriorosponi.figma.site/" target="_blank" rel="noopener noreferrer" class="animate-fade-up delay-3">valeriorosponi.figma.site</a>
    </footer>

    <!-- Minimal aesthetic mini-game logic -->
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx2d = canvas.getContext('2d');
        
        let width, height;
        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width * window.devicePixelRatio;
            canvas.height = height * window.devicePixelRatio;
            ctx2d.scale(window.devicePixelRatio, window.devicePixelRatio);
        }
        window.addEventListener('resize', resize);
        resize();

        // Mouse/Touch tracking
        let mouse = { x: -1000, y: -1000 };
        let currentMouse = { x: -1000, y: -1000 };
        
        window.addEventListener('mousemove', (e) => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
        });
        
        window.addEventListener('touchstart', (e) => {
            mouse.x = e.touches[0].clientX;
            mouse.y = e.touches[0].clientY;
        }, {passive: true});
        
        window.addEventListener('touchmove', (e) => {
            mouse.x = e.touches[0].clientX;
            mouse.y = e.touches[0].clientY;
        }, {passive: true});

        class Target {
            constructor() {
                this.reset(true);
            }
            
            reset(initial = false) {
                // Spawn away from edges
                this.x = Math.random() * (width - 100) + 50;
                this.y = Math.random() * (height - 100) + 50;
                
                // Random gentle drift
                let angle = Math.random() * Math.PI * 2;
                let speed = 0.3 + Math.random() * 0.4;
                this.vx = Math.cos(angle) * speed;
                this.vy = Math.sin(angle) * speed;
                
                this.baseRadius = 5;
                this.radius = 0; // Starts at 0 and grows
                this.targetRadius = 5;
                this.pulse = Math.random() * Math.PI;
                this.color = 'rgba(43, 158, 77, 0.45)'; // Soft matching green
            }

            update() {
                // Smooth spawn growth
                if (this.radius < this.targetRadius) {
                    this.radius += (this.targetRadius - this.radius) * 0.1;
                }

                this.x += this.vx;
                this.y += this.vy;

                // Gentle bounce off screen edges
                if(this.x <= 10 || this.x >= width - 10) this.vx *= -1;
                if(this.y <= 10 || this.y >= height - 10) this.vy *= -1;
                
                // Evasion physics
                let dx = currentMouse.x - this.x;
                let dy = currentMouse.y - this.y;
                let dist = Math.sqrt(dx * dx + dy * dy);
                
                if (dist < 120) {
                    // Push away from cursor
                    let force = (120 - dist) / 120;
                    this.vx -= (dx / dist) * force * 0.5;
                    this.vy -= (dy / dist) * force * 0.5;
                    
                    // Limit max speed
                    let speed = Math.sqrt(this.vx * this.vx + this.vy * this.vy);
                    if (speed > 4.5) {
                        this.vx = (this.vx / speed) * 4.5;
                        this.vy = (this.vy / speed) * 4.5;
                    }
                } else {
                    // Dampen back to relaxed drift speed
                    let speed = Math.sqrt(this.vx * this.vx + this.vy * this.vy);
                    if (speed > 0.8) {
                        this.vx *= 0.97;
                        this.vy *= 0.97;
                    }
                }
                
                // Caught logic!
                if (dist < 15) {
                    createRipple(this.x, this.y);
                    this.reset();
                }
                
                // Subtle breathing effect
                this.pulse += 0.03;
                let renderRadius = this.radius + Math.sin(this.pulse) * 1.5;
                
                // Draw target
                ctx2d.beginPath();
                ctx2d.arc(this.x, this.y, Math.max(0, renderRadius), 0, Math.PI * 2);
                ctx2d.fillStyle = this.color;
                ctx2d.fill();
            }
        }

        // Ripple effects
        let ripples = [];
        function createRipple(x, y) {
            ripples.push({ x, y, radius: 5, alpha: 0.6 });
        }

        let target = new Target();

        // Main game loop
        function animate() {
            // Clear frame
            ctx2d.clearRect(0, 0, width, height);
            
            // Smooth mouse trailing (Lerp physics)
            currentMouse.x += (mouse.x - currentMouse.x) * 0.15;
            currentMouse.y += (mouse.y - currentMouse.y) * 0.15;
            
            // Render ripples
            for (let i = ripples.length - 1; i >= 0; i--) {
                let r = ripples[i];
                r.radius += 2;
                r.alpha -= 0.012;
                
                ctx2d.beginPath();
                ctx2d.arc(r.x, r.y, r.radius, 0, Math.PI * 2);
                ctx2d.strokeStyle = `rgba(43, 158, 77, ${r.alpha})`; // Green ripple
                ctx2d.lineWidth = 1.2;
                ctx2d.stroke();
                
                // Remove faded ripples
                if (r.alpha <= 0) ripples.splice(i, 1);
            }
            
            // Update and render target dot
            target.update();
            
            // Render cursor trailer
            if (currentMouse.x > -500) {
                ctx2d.beginPath();
                ctx2d.arc(currentMouse.x, currentMouse.y, 4, 0, Math.PI * 2);
                ctx2d.fillStyle = 'rgba(26, 26, 26, 0.12)'; // Faint grey aesthetic cursor
                ctx2d.fill();
            }
            
            requestAnimationFrame(animate);
        }
        animate();
    </script>
</body>
</html>
